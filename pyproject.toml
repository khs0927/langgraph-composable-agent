[project]
name = "composable-search"
version = "0.1.0"
description = "Composable, evidence-gated search agent framework built on LangGraph"
requires-python = ">=3.12"
dependencies = ["langgraph>=1.2.0", "pydantic>=2.0", "typing-extensions>=4.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.scripts]
composable-search = "main:main"

[tool.setuptools]
packages = ["composable_search"]
py-modules = ["main"]
